services:
  fish-admin:
    build:
      context: .
      args:
        # The Dockerfile defaults to a mock-free image; Compose is the demo path.
        VITE_ENABLE_MOCK: 'true'
        VITE_API_BASE_URL: /api
    image: fish-admin:local
    # The runtime image listens on 8080 as uid 101.
    ports:
      - '8080:8080'
    restart: unless-stopped
