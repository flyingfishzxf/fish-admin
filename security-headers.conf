# The response header policy, shared by every location block in nginx.conf.
# `add_header` is not inherited by a location that sets its own, which is why the
# static locations used to repeat four lines each and `location /` sent nothing.
# Keep this in step with src/config/security-headers.ts; e2e/security.spec.ts
# checks the preview server, and the container test checks these lines.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
